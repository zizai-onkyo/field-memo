<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Field Memo">
<meta name="format-detection" content="telephone=no">
<title>Field Memo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== ホーム（待機中） ===== -->
<section id="view-home" class="view">
  <header class="topbar">
    <h1>Field Memo</h1>
    <span class="topbar-sub">録音タイムメモ</span>
  </header>

  <div class="start-area">
    <button id="btn-start" class="start-btn" aria-label="タップで記録スタート">
      <span class="start-inner">
        <span class="start-label"><span class="dot"></span>REC</span>
        <span class="start-hint">タップでスタート</span>
      </span>
    </button>
    <p class="start-note">レコーダーの録音ボタンと同時にタップしてください。<br>指が触れた瞬間が 0 秒になります。</p>
  </div>

  <div class="history">
    <div class="section-head">
      <h2>記録一覧</h2>
      <button id="btn-export-all" class="chip-btn">全件CSV</button>
    </div>
    <ul id="session-list" class="session-list"></ul>
    <p class="storage-note">記録はこの端末のブラウザ内にだけ保存されます。こまめにCSVで書き出してください。</p>
  </div>
</section>

<!-- ===== 記録中 ===== -->
<section id="view-rec" class="view" hidden>
  <div class="rec-main">
    <header class="rec-top">
      <div class="rec-status"><span class="dot blink"></span><span>REC</span><span id="rec-name" class="rec-name"></span></div>
      <button id="wake-status" class="wake" data-state="off">自動ロック注意</button>
    </header>

    <div id="stop-slider" class="stop-slider" aria-label="右へスライドして停止">
      <div class="stop-track">
        <span class="stop-label">スライドして停止 ›››</span>
        <div class="stop-thumb" role="button" aria-label="停止スライダー"><span class="sq"></span></div>
      </div>
    </div>

    <div class="clock">
      <div class="elapsed"><span id="el-hms">00:00:00</span><span id="el-ds" class="ds">.0</span></div>
      <div class="clock-sub">現在の区間 <b id="seg-elapsed">0:00.0</b></div>
    </div>

    <div class="tl-card">
      <div class="tl-head">
        <span>タイムライン</span>
        <div class="seg-ctl" data-for="rec">
          <button data-m="all">全体</button>
          <button data-m="300000">5分</button>
          <button data-m="60000">1分</button>
        </div>
      </div>
      <div id="rec-timeline" class="timeline"></div>
    </div>

    <div class="list-head">
      <span>区間 <b id="seg-count">0</b> ・ ピン <b id="pin-count">0</b></span>
      <button id="btn-undo" class="undo-btn">直前の区切りを取消</button>
    </div>
    <ul id="rec-list" class="seg-list"></ul>
  </div>

  <div class="mark-pad">
    <button class="mark star" data-type="star"><small>ここまで</small><b>OK★</b><small>特徴的</small></button>
    <button class="mark ok" data-type="ok"><small>ここまで</small><b>OK</b><small>ノーマル</small></button>
    <button class="mark ng" data-type="ng"><small>ここまで</small><b>NG</b></button>
    <button class="mark cut" data-type="cut"><b>区切る</b><small>判定は後で</small></button>
    <button class="mark pin" data-type="pin"><b>▼ ピン</b><small>コメントは後で入力</small></button>
  </div>
</section>

<!-- ===== 記録の詳細・編集 ===== -->
<section id="view-detail" class="view" hidden>
  <header class="topbar">
    <button id="btn-back" class="link-btn">‹ 一覧</button>
    <span class="spacer"></span>
    <button id="btn-delete" class="link-btn danger">削除</button>
  </header>

  <div class="detail-scroll">
    <label class="name-field">
      <span class="name-label">記録名 ✎</span>
      <input id="d-name" class="name-input" maxlength="80" enterkeyhint="done" placeholder="名前を入力（例: 川辺_ZOOM0012）">
    </label>
    <div id="d-meta" class="meta"></div>
    <div id="d-summary" class="summary"></div>
    <div class="tl-card">
      <div class="tl-head">
        <span>タイムライン</span>
        <div class="seg-ctl" data-for="detail">
          <button data-m="all">全体</button>
          <button data-m="300000">5分</button>
          <button data-m="60000">1分</button>
        </div>
      </div>
      <div id="d-timeline" class="timeline"></div>
    </div>
    <div class="tip-row">
      <p class="tip">区間やピンをタップして編集できます</p>
      <button id="btn-add-pin" class="chip-btn">＋ピン</button>
    </div>
    <ul id="d-list" class="seg-list"></ul>
  </div>

  <footer class="detail-actions">
    <button id="btn-csv" class="primary">CSVをダウンロード</button>
    <button id="btn-share">共有…</button>
  </footer>
</section>

<!-- ===== 区間・ピンの編集シート ===== -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sheet-head">
      <div id="sh-title" class="sheet-title"></div>
      <div id="sh-range" class="sheet-range"></div>
    </div>

    <div class="sh-seg">
      <div id="sh-rating" class="rating-pick">
        <button data-r="star" class="r-star">OK★</button>
        <button data-r="ok" class="r-ok">OK</button>
        <button data-r="ng" class="r-ng">NG</button>
        <button data-r="" class="r-none">未判定</button>
      </div>
      <label class="field">区間メモ
        <input id="sh-note" type="text" placeholder="例: 全体に川の音" enterkeyhint="done">
      </label>
      <div class="sheet-actions">
        <button id="sh-merge">次の区間と結合</button>
        <button class="sh-close primary">完了</button>
      </div>
    </div>

    <div class="sh-pin">
      <label class="field">コメント
        <input id="sh-pin-text" type="text" placeholder="例: 鳥の声 / 飛行機" enterkeyhint="done">
      </label>
      <label class="field">時間（分:秒）
        <input id="sh-pin-time" type="text" enterkeyhint="done" autocomplete="off" placeholder="例: 1:23.4">
      </label>
      <div class="sheet-actions">
        <button id="sh-pin-delete" class="danger">ピンを削除</button>
        <button class="sh-close primary">完了</button>
      </div>
    </div>
  </div>
</div>

<div id="flash" class="flash"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
